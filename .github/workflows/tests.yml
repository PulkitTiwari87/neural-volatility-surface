# PROPOSED (2026-10-16), UNVERIFIED on a runner: it has NEVER run on GitHub Actions. Evidence is local/Colab only:
# the suites passed on Windows / Python 3.12.6 with numpy 1.26 / pandas 2.1, and (2026-10-20) a clean venv with the
# latest unpinned numpy 2.5.4 / pandas 3.0.6 / scipy 1.18.1 / pyarrow 26.0.0 passed 252 backend tests (1 CUDA test
# skipped; 252 is the PC-era count), plus the lint, the python -O leakage step, the 145 spike tests and the audit.
# After AP-004 the backend suite has 278 tests: recorded Colab results (orchestration/reports/COLAB_VERIFICATION.md)
# are 278 OK + 1 skipped on Colab CPU and 278 OK, 0 skipped on Colab T4. None of these is a GitHub-runner result.
# This workflow does NOT decide the Python toolchain (DEC-015 is OPEN): it installs the same four libraries the
# package already imports, unpinned, only to run the synthetic-only tests. Delete or amend it freely.
# No secrets, no market data, no network calls other than package install. GPU tests skip on CPU runners.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # the backend suite takes about 4-6 minutes locally; a hang must not run for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries the package imports (not a toolchain decision)
        run: python -m pip install numpy pandas scipy pyarrow
      - name: Correctness-only lint (syntax errors, undefined names; no style rules - toolchain undecided)
        run: |
          python -m pip install ruff
          python -m ruff check --isolated --select E9,F63,F7,F82 backend scripts
      - name: Backend unit + scientific tests (synthetic data only)
        working-directory: backend
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -t .
      - name: Leakage guards still raise with assertions stripped (python -O)
        working-directory: backend
        env:
          PYTHONPATH: src
        run: python -O -m unittest tests.unit.test_leakage_and_folds
      - name: Phase 0 spike tests (standard library only)
        working-directory: scripts/phase0_synthetic
        run: python -W error::ResourceWarning -m unittest discover -s tests -t .
      - name: Foundation audit (links, IDs, secrets, tracked data)
        run: python scripts/foundation_audit.py
