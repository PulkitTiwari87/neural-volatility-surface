# Public, read-only research API serving ONLY a labelled synthetic run (generated at build time).
# Real-data runs are never deployed: licence of the hosted data is unverified (decision.md).
services:
  - type: web
    name: nvs-research-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt && python scripts/make_synthetic_run.py --out scratch/demo_store
    startCommand: PYTHONPATH=backend/src python -m volatility_lab.api.server --root scratch/demo_store/datasets --host 0.0.0.0 --port $PORT --allow-host .onrender.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
